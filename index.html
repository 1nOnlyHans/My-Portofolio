<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hans Diaz - Full-Stack Developer</title>
    <style>
      /* Loading screen. Plain CSS + inline script so it paints before the React bundle arrives.
         Colours are literals (index.css isn't loaded yet); they mirror --background/--accent. */
      #loader {
        --l-bg: #f8f7f4;
        --l-gold: #d4a853;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: var(--l-bg);
        clip-path: inset(0);
        transition: clip-path 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      html.dark #loader { --l-bg: #111110; }
      html.no-loader #loader { display: none; }

      /* HD monogram: outline draws stroke-first, then the letters fill solid */
      #loader svg { width: clamp(7rem, 22vw, 11rem); height: auto; overflow: visible; }
      #loader .l-mark {
        fill: var(--l-gold);
        fill-opacity: 0;
        fill-rule: evenodd;
        stroke: var(--l-gold);
        stroke-width: 1.5;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: l-draw 1.1s cubic-bezier(0.65, 0, 0.35, 1) 0.15s forwards,
          l-fill 0.5s ease-out 1.1s forwards;
      }
      #loader .l-d { animation-delay: 0.45s, 1.1s; }

      html.loaded #loader { clip-path: inset(0 0 100% 0); pointer-events: none; }
      html.loaded #loader svg { opacity: 0; transform: scale(1.06); transition: opacity 0.3s ease-out, transform 0.5s ease-out; }

      @keyframes l-draw { to { stroke-dashoffset: 0; } }
      @keyframes l-fill { to { fill-opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        #loader .l-mark { animation: none; stroke-dashoffset: 0; fill-opacity: 1; }
        #loader { transition: opacity 0.3s ease-out; clip-path: none; }
        html.loaded #loader { opacity: 0; clip-path: none; }
        html.loaded #loader svg { transform: none; }
      }
    </style>
    <noscript><style>#loader { display: none; }</style></noscript>
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var t = localStorage.getItem("theme");
          if (t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) d.classList.add("dark");
        } catch (e) {}
        // never over the admin panel
        if (location.pathname.indexOf("/admin") === 0) {
          d.classList.add("no-loader");
          return;
        }

        // hold long enough for the monogram to finish drawing and filling
        var MIN = 1900, start = Date.now(), done = false;
        function open() {
          if (done) return;
          done = true;
          setTimeout(function () {
            d.classList.add("loaded");
            setTimeout(function () {
              var l = document.getElementById("loader");
              if (l) l.remove();
            }, 900);
          }, Math.max(0, MIN - (Date.now() - start)));
        }
        if (document.readyState === "complete") open();
        else addEventListener("load", open);
        setTimeout(open, 5000); // never trap the page behind slow images
      })();
    </script>
  </head>
  <body>
    <div id="loader" role="status" aria-label="Loading">
      <svg viewBox="0 0 144 80" aria-hidden="true">
        <path class="l-mark l-h" pathLength="1" d="M0 0H14V34H46V0H60V80H46V46H14V80H0Z" />
        <path
          class="l-mark l-d"
          pathLength="1"
          d="M76 0H100C128 0 144 18 144 40C144 62 128 80 100 80H76ZM90 12V68H100C118 68 130 56 130 40C130 24 118 12 100 12Z"
        />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
